name: CampusNet Guard Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build EXE
        run: python build.py

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows-package | Out-Null
          Copy-Item docs\START_HERE_WINDOWS.txt dist\windows-package\0-先看我-使用说明.txt
          Copy-Item dist\campusnet-guard-gui.exe dist\windows-package\1-点我启动-校园网守护.exe
          Copy-Item docs\QUICK_START_WINDOWS.md dist\windows-package\2-快速使用指南.md
          Copy-Item dist\campusnet-guard-cli.exe dist\windows-package\9-排障工具-不懂不用点.exe
          Copy-Item docs\DISCLAIMER.md dist\windows-package\9-免责声明.md
          Compress-Archive -Path dist\windows-package\* -DestinationPath dist\campusnet-guard-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/campusnet-guard-windows.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Debian package
        run: bash scripts/linux/build_deb.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/*.deb
            dist/*.sha256

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/campusnet-guard-windows.zip
            dist/*.deb
            dist/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
