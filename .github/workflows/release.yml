name: CampusNet Guard Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller

    - name: Build EXE
      run: |
        python build.py

    - name: Package zip
      run: |
        Compress-Archive -Path dist\campusnet-guard-gui.exe, dist\campusnet-guard-cli.exe, docs\QUICK_START_WINDOWS.md -DestinationPath dist\campusnet-guard-windows.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/campusnet-guard-gui.exe
          dist/campusnet-guard-cli.exe
          dist/campusnet-guard-windows.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
