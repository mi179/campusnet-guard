name: 🛡️ CampusNet Guard 自动打包发布

on:
  push:
    tags:
      - 'v*'                  # 推送 v 开头标签时触发，如 v0.1.0

permissions:
  contents: write             # 创建 Release + 上传资产（最小权限）

jobs:
  build-and-release:
    runs-on: windows-latest    # GitHub 云 Windows 虚拟机
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
    - name: 📥 1. 拉取最新代码
      uses: actions/checkout@v4

    - name: 🐍 2. 初始化云端 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 3. 安装本地依赖与打包神器
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller

    - name: 🏗️ 4. 执行 PyInstaller 编译单文件 EXE
      run: |
        python build.py

    - name: 🏷️ 5. 重命名产物为 CampusNet Guard 品牌
      run: |
        Copy-Item dist\cyber-lobster-gui.exe dist\campusnet-guard-gui.exe
        Copy-Item dist\cyber-lobster-cli.exe dist\campusnet-guard-cli.exe

    - name: 📦 6. 打包 Windows 发布包
      run: |
        Compress-Archive -Path dist\campusnet-guard-gui.exe, dist\campusnet-guard-cli.exe, docs\QUICK_START_WINDOWS.md -DestinationPath dist\campusnet-guard-windows.zip

    - name: 🚀 7. 自动创建 GitHub Release 并上传
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/campusnet-guard-gui.exe
          dist/campusnet-guard-cli.exe
          dist/campusnet-guard-windows.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
