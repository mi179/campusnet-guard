[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campusnet-guard"
version = "0.1.6"
description = "适配 Ruijie ePortal 的校园网自动认证与断网重连工具"
authors = [{ name = "mi179" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["campus", "network", "eportal", "ruijie", "auto-login", "reconnect"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/mi179/campusnet-guard"
Repository = "https://github.com/mi179/campusnet-guard"
Issues = "https://github.com/mi179/campusnet-guard/issues"
Documentation = "https://github.com/mi179/campusnet-guard#readme"

[project.scripts]
campusnet = "cyber_lobster.cli:main"
campusnet-guard = "cyber_lobster.cli:main"
cyber-lobster = "cyber_lobster.cli:main"
campusnet-gui = "cyber_lobster.gui:main"
campusnet-guard-gui = "cyber_lobster.gui:main"
cyber-lobster-gui = "cyber_lobster.gui:main"

[tool.setuptools]
py-modules = ["exe_main", "gui_main"]

[tool.setuptools.packages.find]
where = ["src"]
